name: Tests

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    name: test (py${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Run tests
        env:
          UV_PYTHON_PREFERENCE: managed
        run: uv run --python ${{ matrix.python }} pytest

  # The single check that branch rules require for the test matrix, so that
  # renaming or adding matrix jobs does not leave the rules waiting on old names.
  tests-passed:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every test job passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test matrix result: ${{ needs.test.result }}" >&2
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Ruff
        run: |
          uvx ruff@0.11.4 check src tests
          uvx ruff@0.11.4 format --check src tests

      - name: ty
        run: |
          uv sync
          uvx ty@0.0.89 check --python .venv/bin/python src tests
